plugins {
    id 'com.android.application'
}

android {
    namespace 'kr.unsong.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.unsong.mobile'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // 항상 같은 열쇠로 서명해야 새 버전을 기존 앱 위에 덮어 설치할 수 있다.
    signingConfigs {
        shared {
            storeFile file('unsong.jks')
            storePassword 'unsong-mobile'
            keyAlias 'unsong'
            keyPassword 'unsong-mobile'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            signingConfig signingConfigs.shared
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // 캡처 글자 인식(한글). 모델이 앱 안에 들어 있어 인터넷 없이 동작한다.
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
